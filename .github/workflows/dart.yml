name: Dart
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.4'
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
      - run: dart run example/independent_client.dart
      - run: dart compile js -O2 -o .dart_tool/independent_client.js example/independent_client.dart
      - run: node -e "globalThis.self = globalThis; require('./.dart_tool/independent_client.js');"
      - run: dart pub publish --dry-run
